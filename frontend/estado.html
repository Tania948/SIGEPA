<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estado · SIGEPA MX</title>
  <link rel="icon" href="assets/img/logo-sigepa.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta name="theme-color" content="#263b32">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="contenedor pagina" style="gap:28px">
    <div class="estado-encabezado">
      <div data-ruta></div>
      <a class="enlace-plano" href="index.html#territorio" data-volver><i data-icon="arrow-left" data-size="16"></i>Volver al mapa</a>
    </div>

    <section class="estado-hero" data-hero>
      <div class="estado-hero__texto">
        <p class="eyebrow" data-zona></p>
        <h1 data-nombre></h1>
        <p data-texto></p>
        <p class="estado-hero__etiquetas" data-etiquetas></p>
      </div>
    </section>

    <section class="estado-listado" style="gap:14px">
      <div class="seccion-encabezado">
        <h2 class="titulo-md">Sus municipios en el mapa</h2>
        <p class="texto-xs" data-mapa-ayuda>Toca un municipio para ver sus recetas.</p>
      </div>
      <div class="mapa-estado" data-mapa-estado role="application" aria-label="Mapa de municipios"></div>
    </section>

    <div class="estado-buscar">
      <div class="campo">
        <label for="cambiar-estado">Cambiar de estado</label>
        <div class="entrada"><select id="cambiar-estado" data-select></select><i data-icon="chevron-down"></i></div>
      </div>
      <form class="buscador" role="search" data-buscar>
        <i data-icon="search" data-size="20"></i>
        <label class="sr-only" for="q">Buscar en este estado</label>
        <input id="q" type="search" autocomplete="off">
        <button class="btn btn--primario" type="submit" data-buscar-btn>Buscar</button>
      </form>
    </div>

    <div class="estado-filtros" data-filtros></div>

    <section class="estado-listado">
      <h2 class="titulo-md" data-titulo-lista></h2>
      <div class="resultados__barra"><p data-conteo></p><div data-orden></div></div>
      <div class="rejilla-recetas" data-lista></div>
      <div data-paginacion></div>
    </section>

    <section class="banda banda--crema">
      <div class="banda__mensaje">
        <i data-icon="map-pin" data-size="34"></i>
        <div>
          <h2>¿Qué se cocina en tu comunidad?</h2>
          <p data-invitacion>Ayúdanos a contar México desde tu mesa. Comparte una receta y el lugar al que pertenece.</p>
        </div>
      </div>
      <a class="btn btn--primario" href="publicar.html" data-aportar>Aportar una receta</a>
    </section>
  </main>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script type="module" src="js/paginas/estado.js"></script>
</body>
</html>
